<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=https://sdotnegev.org.il/675">
<title>מעביר אותך...</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    direction: rtl;
  }
  .container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .spinner {
    width: 42px;
    height: 42px;
    border: 4px solid #d0d7de;
    border-top-color: #2b6cb0;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  h1 {
    font-size: 1.3rem;
    color: #222;
    margin: 0 0 10px;
  }
  p {
    color: #555;
    font-size: 1rem;
    margin: 0 0 24px;
    max-width: 380px;
  }
  .btn {
    display: inline-block;
    background: #2b6cb0;
    color: #fff;
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 8px;
    font-size: 1.05rem;
    font-weight: bold;
    transition: background 0.2s ease;
  }
  .btn:hover {
    background: #1e4e80;
  }
  .fallback-note {
    margin-top: 14px;
    font-size: 0.85rem;
    color: #888;
  }
</style>
<script>
  window.location.replace("https://sdotnegev.org.il/675");
</script>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>מעביר אותך לעמוד הבא</h1>
    <p>אם ההעברה האוטומטית לא פועלת, לחצו על הכפתור למטה כדי לפתוח קריאה למחלקת מחשוב.</p>
    <a class="btn" href="https://sdotnegev.org.il/675">פתיחת קריאה למחלקת מחשוב</a>
    <div class="fallback-note">אם הדף לא עבר אוטומטית תוך מספר שניות, השתמשו בכפתור.</div>
  </div>
</body>
</html>
